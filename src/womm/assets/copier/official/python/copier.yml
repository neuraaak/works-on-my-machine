_womm:
  description: "Python project (optional Django)"
  version: "2.0.0"

_subdirectory: template

project_name:
  type: str
  help: "Project name"

package_name:
  type: str
  help: "Importable package name"
  default: "{{ project_name | lower | replace('-', '_') | replace(' ', '_') }}"

description:
  type: str
  help: "One-line project description"
  default: "A Python project"

author_name:
  type: str
  help: "Author name"
  default: ""

use_src_layout:
  type: bool
  help: "Use a src/ layout"
  default: true

python_version:
  type: str
  help: "Minimum Python version"
  choices:
    - "3.10"
    - "3.11"
    - "3.12"
    - "3.13"
  default: "3.12"

use_uv:
  type: bool
  help: "Use uv for dependency management, venv and task running"
  default: true

framework:
  type: str
  help: "Framework"
  choices:
    - none
    - django
  default: none

with_tests:
  type: bool
  help: "Include a pytest setup"
  default: true

with_ci:
  type: bool
  help: "Include a GitHub Actions workflow"
  default: true

with_vscode:
  type: bool
  help: "Include shared VS Code settings"
  default: true

license:
  type: str
  help: "License"
  choices:
    - MIT
    - Apache-2.0
    - proprietary
  default: MIT

# manage.py always sits at the project root, independent of use_src_layout.
# The package-level Django files mirror both possible layout roots; only the
# one matching use_src_layout ever exists at render time, so listing both is
# harmless when the other one wasn't rendered in the first place.
_exclude:
  - "{% if framework != 'django' %}manage.py{% endif %}"
  - "{% if framework != 'django' %}src/{{ package_name }}/settings.py{% endif %}"
  - "{% if framework != 'django' %}src/{{ package_name }}/urls.py{% endif %}"
  - "{% if framework != 'django' %}src/{{ package_name }}/wsgi.py{% endif %}"
  - "{% if framework != 'django' %}src/{{ package_name }}/asgi.py{% endif %}"
  - "{% if framework != 'django' %}src/{{ package_name }}/core/__init__.py{% endif %}"
  - "{% if framework != 'django' %}src/{{ package_name }}/core/apps.py{% endif %}"
  - "{% if framework != 'django' %}src/{{ package_name }}/core/models.py{% endif %}"
  - "{% if framework != 'django' %}src/{{ package_name }}/core/views.py{% endif %}"
  - "{% if framework != 'django' %}{{ package_name }}/settings.py{% endif %}"
  - "{% if framework != 'django' %}{{ package_name }}/urls.py{% endif %}"
  - "{% if framework != 'django' %}{{ package_name }}/wsgi.py{% endif %}"
  - "{% if framework != 'django' %}{{ package_name }}/asgi.py{% endif %}"
  - "{% if framework != 'django' %}{{ package_name }}/core/__init__.py{% endif %}"
  - "{% if framework != 'django' %}{{ package_name }}/core/apps.py{% endif %}"
  - "{% if framework != 'django' %}{{ package_name }}/core/models.py{% endif %}"
  - "{% if framework != 'django' %}{{ package_name }}/core/views.py{% endif %}"
